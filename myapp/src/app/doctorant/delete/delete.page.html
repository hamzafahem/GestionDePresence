<ion-card>
  <ion-header>
    <ion-toolbar>
      <ion-title>form</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card-content>
    <form>
      <!-- Name input field -->
      <ion-item lines="full">
        <ion-label position="floating">Name:</ion-label>
        <ion-input  type="text" required></ion-input>
      </ion-item>
      <ion-item lines="full">
        <ion-label position="floating">prenom:</ion-label>
        <ion-input  type="text" required></ion-input>
      </ion-item>
      <ion-item lines="full">
        <ion-label position="floating">Name</ion-label>
        <ion-input  type="text" required></ion-input>
      </ion-item>
      <!-- Email input field -->
      <ion-item lines="full">
        <ion-label position="floating">Email</ion-label>
        <ion-input  type="email" required></ion-input>
      </ion-item>

      <!-- Date of Birth (DOB) datetime picker -->
      <ion-item lines="full">
        <ion-label position="floating">DOB</ion-label>
        <ion-datetime ></ion-datetime>
      </ion-item>

      <!-- Mobile input field -->
      <ion-item lines="full">
        <ion-label position="floating">Mobile</ion-label>
        <ion-input  type="text" required></ion-input>
      </ion-item>

      <!-- Submit button -->
      <ion-row>
        <ion-col>
          <ion-button type="submit" color="danger" expand="block">Submit</ion-button>
        </ion-col>
      </ion-row>
    </form>
  </ion-card-content>
</ion-card>
