<ion-header [translucent]="true" class="cp-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/hamza" text="" (click)="closemodal()"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="key-outline"></ion-icon>
      Changer le mot de passe
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cp-content">
  <div class="cp-card">
    <div class="cp-icon"><ion-icon name="shield-checkmark-outline"></ion-icon></div>
    <p class="cp-intro">Choisissez un nouveau mot de passe sécurisé pour votre compte.</p>

    <div class="field">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input [type]="showOld ? 'text' : 'password'" placeholder="Ancien mot de passe" [(ngModel)]="oldPassword">
      <ion-icon class="eye" [name]="showOld ? 'eye-off-outline' : 'eye-outline'" (click)="showOld = !showOld"></ion-icon>
    </div>

    <div class="field">
      <ion-icon name="lock-open-outline"></ion-icon>
      <input [type]="showNew ? 'text' : 'password'" placeholder="Nouveau mot de passe" [(ngModel)]="newPassword">
      <ion-icon class="eye" [name]="showNew ? 'eye-off-outline' : 'eye-outline'" (click)="showNew = !showNew"></ion-icon>
    </div>

    <div class="field">
      <ion-icon name="checkmark-done-outline"></ion-icon>
      <input [type]="showNew ? 'text' : 'password'" placeholder="Confirmer le nouveau mot de passe" [(ngModel)]="confirmPassword">
    </div>

    <button class="submit-btn" [disabled]="submitting" (click)="submit()">
      <ion-icon name="save-outline"></ion-icon>
      Enregistrer
    </button>
  </div>
</ion-content>
