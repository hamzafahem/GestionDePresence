<ion-header class="theme-header completes">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="/menu" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="checkmark-done-outline"></ion-icon>
      Les formations complètes
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/hamza">
        <ion-icon name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="theme-content completes">
  <ion-searchbar placeholder="Rechercher une formation" showCancelButton="focus" (ionInput)="onSearchChange($event)"></ion-searchbar>

  <div class="ion-text-center ion-padding" *ngIf="loading">
    <ion-spinner></ion-spinner>
  </div>

  <div class="empty-note" *ngIf="!loading && Formation.length === 0">
    Aucune formation complétée pour le moment.
  </div>

  <div class="theme-card" *ngFor="let item of Formation" routerLink="./module-n" (click)="selectFormation(item)">
    <div class="theme-icon completes"><img src="/assets/formation_default.webp" alt=""></div>
    <div class="theme-text">
      <h4 class="ion-text-capitalize">{{ item.intitule }}</h4>
      <p>{{ item.date_debut | date:'dd/MM/yyyy' }} — {{ item.date_fin | date:'dd/MM/yyyy' }}</p>
    </div>
    <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
  </div>
</ion-content>
