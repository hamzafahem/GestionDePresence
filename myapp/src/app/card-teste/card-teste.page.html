<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Cards</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="bg_circle"></div>
  <ion-row>
    <!-- <swiper [config]="bannerConfig"> -->
      <ng-template swiperSlide *ngFor="let card of cards">
        <div class="card_details">
          <img src="../../assets/background-app-features-support.jpg" />
          <div align="center">
            <ion-label>
              <div class="acc-amt">
                <ion-text color="primary">
               mizo
                </ion-text></div>
              <span>
                <!-- {{card?.card_holder}} -->
                hamza
              </span>
            </ion-label>
          </div>
          <p class="exp ion-text-start">
            <ion-text color="dark">
            <!-- {{card?.exp_date}} -->
            2001-04-01
          </ion-text></p>
        </div>
      </ng-template>
    <!-- </swiper> -->
  </ion-row>
  <ion-list class="transactions">
    <ion-list-header>
      <ion-label color="medium">Settings</ion-label>
    </ion-list-header>
    <ion-item-group>
      <ion-item lines="full">
        <ion-label>
          Enable Card
        </ion-label>
        <ion-toggle slot="end" [checked]="true"></ion-toggle>
      </ion-item>
    </ion-item-group>
    <ion-item-group>
      <ion-item lines="full" detail>
        <ion-label>
          Change Pin
        </ion-label>
      </ion-item>
    </ion-item-group>

  </ion-list>
</ion-content>
