<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nouveau rendez-vous — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4">Nouveau rendez-vous</h2>

    <form th:action="@{/backoffice/rendezvous}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Doctorant</label>
            <select name="doctorantId" class="form-select" required>
                <option th:each="d : ${doctorants}" th:value="${d.id}" th:text="${d.nom} + ' ' + ${d.prenom}"
                        th:selected="${d.id} == ${request.doctorantId}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Formateur</label>
            <select name="formateurId" class="form-select">
                <option value="">—</option>
                <option th:each="f : ${formateurs}" th:value="${f.id}" th:text="${f.prenomFr} + ' ' + ${f.nomFr}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Objet</label>
            <input type="text" name="objet" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Date et heure</label>
            <input type="datetime-local" name="dateHeure" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Lieu</label>
            <input type="text" name="lieu" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Statut</label>
            <select name="statut" class="form-select">
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Commentaire</label>
            <textarea name="commentaire" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/rendezvous}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
