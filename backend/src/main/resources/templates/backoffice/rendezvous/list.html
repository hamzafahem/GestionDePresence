<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Rendez-vous — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-calendar-event-fill"></i></div>
            <div>
                <h3>Rendez-vous</h3>
                <p class="page-subtitle">Rendez-vous avec les doctorants</p>
            </div>
        </div>
        <a th:href="@{/backoffice/rendezvous/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouveau rendez-vous</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#rendezvousTable" placeholder="Rechercher un rendez-vous...">
            </div>
        </div>
        <div class="filter-select">
            <label>Statut</label>
            <select class="form-select js-table-filter" data-target="#rendezvousTable" data-filter-key="statut">
                <option value="">Tous les statuts</option>
                <option value="PLANIFIE">Planifié</option>
                <option value="CONFIRME">Confirmé</option>
                <option value="ANNULE">Annulé</option>
                <option value="TERMINE">Terminé</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${rendezvous.size()} + ' rendez-vous'"></div>
        <table class="table js-filterable" id="rendezvousTable">
            <thead>
            <tr><th>Doctorant</th><th>Formateur</th><th>Objet</th><th>Date/heure</th><th>Lieu</th><th>Statut</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="r, iter : ${rendezvous}" th:attr="data-statut=${r.statut}">
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(r.doctorantPrenom,0,1)} + ${#strings.substring(r.doctorantNom,0,1)}"></span>
                        <span th:text="${r.doctorantNom} + ' ' + ${r.doctorantPrenom}"></span>
                    </div>
                </td>
                <td th:text="${r.formateurNomFr}"></td>
                <td th:text="${r.objet}"></td>
                <td th:text="${r.dateHeure}"></td>
                <td th:text="${r.lieu}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${r.statut == 'CONFIRME'} ? '#22c1a4' : (${r.statut == 'ANNULE'} ? '#ef6b6b' : (${r.statut == 'TERMINE'} ? '#5b7cfa' : '#f5a623')))"></span>
                        <span th:switch="${r.statut}">
                            <span th:case="'CONFIRME'">Confirmé</span>
                            <span th:case="'ANNULE'">Annulé</span>
                            <span th:case="'TERMINE'">Terminé</span>
                            <span th:case="*">Planifié</span>
                        </span>
                    </span>
                </td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-secondary btn-action js-view-row"><i class="bi bi-eye"></i> Voir</button>
                    <form th:action="@{/backoffice/rendezvous/{id}/delete(id=${r.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer ce rendez-vous ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
