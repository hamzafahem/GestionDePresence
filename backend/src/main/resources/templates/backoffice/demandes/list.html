<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Demandes — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-envelope-paper-fill"></i></div>
            <div>
                <h3>Demandes</h3>
                <p class="page-subtitle">Demandes soumises par les doctorants</p>
            </div>
        </div>
        <a th:href="@{/backoffice/demandes/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle demande</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#demandesTable" placeholder="Rechercher une demande...">
            </div>
        </div>
        <div class="filter-select">
            <label>Statut</label>
            <select class="form-select js-table-filter" data-target="#demandesTable" data-filter-key="statut">
                <option value="">Tous les statuts</option>
                <option value="EN_ATTENTE">En attente</option>
                <option value="APPROUVEE">Approuvée</option>
                <option value="REJETEE">Rejetée</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${demandes.size()} + ' demandes'"></div>
        <table class="table js-filterable" id="demandesTable">
            <thead>
            <tr><th>Doctorant</th><th>Type</th><th>Objet</th><th>Statut</th><th>Traitement</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="d, iter : ${demandes}" th:attr="data-statut=${d.statut}">
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(d.doctorantPrenom,0,1)} + ${#strings.substring(d.doctorantNom,0,1)}"></span>
                        <span th:text="${d.doctorantNom} + ' ' + ${d.doctorantPrenom}"></span>
                    </div>
                </td>
                <td th:text="${d.type}"></td>
                <td th:text="${d.objet}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${d.statut == 'APPROUVEE'} ? '#22c1a4' : (${d.statut == 'REJETEE'} ? '#ef6b6b' : '#f5a623'))"></span>
                        <span th:switch="${d.statut}">
                            <span th:case="'APPROUVEE'">Approuvée</span>
                            <span th:case="'REJETEE'">Rejetée</span>
                            <span th:case="*">En attente</span>
                        </span>
                    </span>
                </td>
                <td style="min-width: 260px;">
                    <form th:if="${d.statut == 'EN_ATTENTE'}" th:action="@{/backoffice/demandes/{id}/traiter(id=${d.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="input-group input-group-sm mb-1">
                            <select name="statut" class="form-select">
                                <option value="APPROUVEE">Approuver</option>
                                <option value="REJETEE">Rejeter</option>
                            </select>
                            <button type="submit" class="btn btn-outline-primary">Valider</button>
                        </div>
                        <input type="text" name="reponse" class="form-control form-control-sm" placeholder="Réponse (optionnel)"/>
                    </form>
                    <span th:unless="${d.statut == 'EN_ATTENTE'}" class="text-muted small" th:text="${d.reponse}"></span>
                </td>
                <td class="text-end">
                    <form th:action="@{/backoffice/demandes/{id}/delete(id=${d.id})}" method="post"
                          onsubmit="return confirm('Supprimer cette demande ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
