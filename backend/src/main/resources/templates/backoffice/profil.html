<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Mon profil — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4">Mon profil</h2>

    <div class="alert alert-success" th:if="${saved}">Profil mis à jour.</div>

    <form th:action="@{/backoffice/profil}" th:object="${profile}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Nom (FR)</label>
            <input type="text" name="nomFr" class="form-control" th:value="${profile.nomFr}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Prénom (FR)</label>
            <input type="text" name="prenomFr" class="form-control" th:value="${profile.prenomFr}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" th:value="${profile.email}"/>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Âge</label>
                <input type="number" name="age" class="form-control" th:value="${profile.age}"/>
            </div>
            <div class="col-md-8 mb-3">
                <label class="form-label">Sexe</label>
                <input type="text" name="sexe" class="form-control" th:value="${profile.sexe}"/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Téléphone</label>
            <input type="text" name="phone" class="form-control" th:value="${profile.phone}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse</label>
            <input type="text" name="address" class="form-control" th:value="${profile.address}"/>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
</div>
</body>
</html>
