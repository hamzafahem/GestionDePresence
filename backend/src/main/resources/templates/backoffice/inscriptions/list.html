<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Inscriptions — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-person-check-fill"></i></div>
            <div>
                <h3>Inscriptions</h3>
                <p class="page-subtitle">Demandes d'inscription des doctorants aux formations, toutes formations confondues</p>
            </div>
        </div>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#inscriptionsTable" placeholder="Rechercher un doctorant, une formation...">
            </div>
        </div>
        <div class="filter-select">
            <label>Statut</label>
            <select class="form-select js-table-filter" data-target="#inscriptionsTable" data-filter-key="statut">
                <option value="">Tous les statuts</option>
                <option value="EN_ATTENTE">En attente</option>
                <option value="APPROUVEE">Approuvée</option>
                <option value="REJETEE">Rejetée</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${inscriptions.size()} + ' inscriptions'"></div>
        <table class="table js-filterable" id="inscriptionsTable">
            <thead>
            <tr><th>Doctorant</th><th>Formation</th><th>Statut</th><th>Demandée le</th><th>Traitée par</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="i, iter : ${inscriptions}" th:attr="data-statut=${i.statut}">
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(i.doctorantPrenom,0,1)} + ${#strings.substring(i.doctorantNom,0,1)}"></span>
                        <span th:text="${i.doctorantNom} + ' ' + ${i.doctorantPrenom}"></span>
                    </div>
                </td>
                <td th:text="${i.formationIntitule}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${i.statut == 'APPROUVEE'} ? '#22c1a4' : (${i.statut == 'REJETEE'} ? '#ef6b6b' : '#f5a623'))"></span>
                        <span th:switch="${i.statut}">
                            <span th:case="'APPROUVEE'">Approuvée</span>
                            <span th:case="'REJETEE'">Rejetée</span>
                            <span th:case="*">En attente</span>
                        </span>
                    </span>
                </td>
                <td th:text="${i.dateCreation}"></td>
                <td th:text="${i.traiteParNomFr}"></td>
                <td class="text-end">
                    <form th:if="${i.statut == 'EN_ATTENTE'}" th:action="@{/backoffice/inscriptions/{id}/traiter(id=${i.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="statut" value="APPROUVEE"/>
                        <button type="submit" class="btn btn-sm btn-outline-success btn-action"><i class="bi bi-check-lg"></i> Approuver</button>
                    </form>
                    <form th:if="${i.statut == 'EN_ATTENTE'}" th:action="@{/backoffice/inscriptions/{id}/traiter(id=${i.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="statut" value="REJETEE"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-x-lg"></i> Rejeter</button>
                    </form>
                    <form th:action="@{/backoffice/inscriptions/{id}/delete(id=${i.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cette inscription ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary btn-action"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
