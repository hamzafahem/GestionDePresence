<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Doctorants — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-people-fill"></i></div>
            <div>
                <h3>Doctorants</h3>
                <p class="page-subtitle">Gestion des doctorants</p>
            </div>
        </div>
        <a th:href="@{/backoffice/doctorants/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouveau doctorant</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#doctorantsTable" placeholder="Rechercher un doctorant...">
            </div>
        </div>
        <div class="filter-select">
            <label>Filière</label>
            <select class="form-select js-table-filter" data-target="#doctorantsTable" data-filter-key="filiere">
                <option value="">Toutes les filières</option>
                <option th:each="f : ${filieres}" th:value="${f}" th:text="${f}"></option>
            </select>
        </div>
        <div class="filter-select">
            <label>Statut</label>
            <select class="form-select js-table-filter" data-target="#doctorantsTable" data-filter-key="statut">
                <option value="">Tous les statuts</option>
                <option value="ACTIF">Actif</option>
                <option value="SUSPENDU">Suspendu</option>
                <option value="DIPLOME">Diplômé</option>
                <option value="ABANDONNE">Abandonné</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${doctorants.size()} + ' doctorants'"></div>
        <table class="table js-filterable" id="doctorantsTable">
            <thead>
            <tr><th>Nom &amp; prénom</th><th>Code Apogée</th><th>CIN</th><th>Filière</th><th>Statut</th><th>Affectation</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="d, iter : ${doctorants}" th:attr="data-filiere=${d.filiere},data-statut=${d.statut}">
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(d.prenom,0,1)} + ${#strings.substring(d.nom,0,1)}"></span>
                        <span th:text="${d.nom} + ' ' + ${d.prenom}"></span>
                    </div>
                </td>
                <td th:text="${d.codeApogee}"></td>
                <td th:text="${d.cin}"></td>
                <td th:text="${d.filiere}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${d.statut == 'ACTIF'} ? '#22c1a4' : (${d.statut == 'SUSPENDU'} ? '#f5a623' : (${d.statut == 'DIPLOME'} ? '#5b7cfa' : '#ef6b6b')))"></span>
                        <span th:switch="${d.statut}">
                            <span th:case="'ACTIF'">Actif</span>
                            <span th:case="'SUSPENDU'">Suspendu</span>
                            <span th:case="'DIPLOME'">Diplômé</span>
                            <span th:case="'ABANDONNE'">Abandonné</span>
                        </span>
                    </span>
                </td>
                <td style="min-width: 260px;">
                    <form th:action="@{/backoffice/doctorants/{id}/encadrant(id=${d.id})}" method="post" class="d-flex gap-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="formateurId" class="form-select form-select-sm">
                            <option value="">Affecter un formateur</option>
                            <option th:each="f : ${formateurs}" th:value="${f.id}"
                                    th:text="${f.prenomFr} + ' ' + ${f.nomFr}"
                                    th:selected="${f.id} == ${d.encadrantId}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary btn-action text-nowrap"><i class="bi bi-person-check"></i> Affecter</button>
                    </form>
                    <form th:if="${d.encadrantId} != null" th:action="@{/backoffice/doctorants/{id}/encadrant/delete(id=${d.id})}" method="post" class="mt-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-person-dash"></i> Retirer</button>
                    </form>
                </td>
                <td class="text-end">
                    <a th:href="@{/backoffice/doctorants/{id}(id=${d.id})}" class="btn btn-sm btn-outline-secondary btn-action"><i class="bi bi-eye"></i> Voir</a>
                    <a th:href="@{/backoffice/doctorants/{id}/edit(id=${d.id})}" class="btn btn-sm btn-outline-primary btn-action"><i class="bi bi-pencil"></i> Modifier</a>
                    <form th:action="@{/backoffice/doctorants/{id}/delete(id=${d.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer ce doctorant ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
