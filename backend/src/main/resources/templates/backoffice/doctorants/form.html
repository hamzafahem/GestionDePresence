<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Doctorant — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 720px;">
    <h2 class="mb-4" th:text="${doctorantId} != null ? 'Modifier le doctorant' : 'Nouveau doctorant'"></h2>

    <form th:action="${doctorantId} != null ? @{/backoffice/doctorants/{id}(id=${doctorantId})} : @{/backoffice/doctorants}"
          method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nom</label>
                <input type="text" name="nom" class="form-control" th:value="${request.nom}" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" name="prenom" class="form-control" th:value="${request.prenom}" required/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Code Apogée</label>
                <input type="text" name="codeApogee" class="form-control" th:value="${request.codeApogee}" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">CIN</label>
                <input type="text" name="cin" class="form-control" th:value="${request.cin}"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">CNE</label>
                <input type="text" name="cne" class="form-control" th:value="${request.cne}"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Filière</label>
                <input type="text" name="filiere" class="form-control" th:value="${request.filiere}"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" th:value="${request.email}"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Mobile</label>
                <input type="text" name="mobile" class="form-control" th:value="${request.mobile}"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nationalité</label>
                <input type="text" name="nationalite" class="form-control"
                       th:value="${request.nationalite} ?: 'Marocaine'"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Date de naissance</label>
                <input type="date" name="dateNaissance" class="form-control" th:value="${request.dateNaissance}"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Formation</label>
                <select name="formationId" class="form-select">
                    <option value="">—</option>
                    <option th:each="f : ${formations}" th:value="${f.id}" th:text="${f.intitule}"
                            th:selected="${f.id} == ${request.formationId}"></option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Statut</label>
                <select name="statut" class="form-select">
                    <option value="ACTIF" th:selected="${request.statut} == 'ACTIF' or ${request.statut} == null">Actif</option>
                    <option value="SUSPENDU" th:selected="${request.statut} == 'SUSPENDU'">Suspendu</option>
                    <option value="DIPLOME" th:selected="${request.statut} == 'DIPLOME'">Diplômé</option>
                    <option value="ABANDONNE" th:selected="${request.statut} == 'ABANDONNE'">Abandonné</option>
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Détails</label>
            <textarea name="details" class="form-control" th:text="${request.details}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/doctorants}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
