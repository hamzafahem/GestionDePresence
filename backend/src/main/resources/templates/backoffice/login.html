<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Connexion — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 8rem;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="card-title mb-3 text-center">mpresence — Back-office</h4>
            <p class="text-muted text-center small">Réservé aux comptes Admin / Formateur</p>

            <div class="alert alert-danger" th:if="${param.error}">CIN ou mot de passe incorrect.</div>
            <div class="alert alert-success" th:if="${param.logout}">Vous avez été déconnecté.</div>

            <form th:action="@{/backoffice/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">CIN</label>
                    <input type="text" name="username" class="form-control" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
