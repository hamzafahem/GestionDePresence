<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Formateurs — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-person-workspace"></i></div>
            <div>
                <h3>Formateurs</h3>
                <p class="page-subtitle">Gestion globale des comptes formateurs</p>
            </div>
        </div>
        <a th:href="@{/backoffice/formateurs/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouveau formateur</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#formateursTable" placeholder="Rechercher un formateur...">
            </div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${formateurs.size()} + ' formateurs'"></div>
        <table class="table js-filterable" id="formateursTable">
            <thead>
            <tr><th>Nom &amp; prénom</th><th>CIN</th><th>Email</th><th>Téléphone</th><th>Affectations</th><th>Statut</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="f, iter : ${formateurs}">
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(f.prenomFr,0,1)} + ${#strings.substring(f.nomFr,0,1)}"></span>
                        <span th:text="${f.prenomFr} + ' ' + ${f.nomFr}"></span>
                    </div>
                </td>
                <td th:text="${f.cin}"></td>
                <td th:text="${f.email} ?: '—'"></td>
                <td th:text="${f.phone} ?: '—'"></td>
                <td>
                    <span class="badge text-bg-light text-dark border" th:text="${f.nbFormationsAffectees} + ' formation(s)'"></span>
                    <span class="badge text-bg-light text-dark border" th:text="${f.nbModulesAffectes} + ' module(s)'"></span>
                </td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${f.enabled} ? '#22c1a4' : '#ef6b6b')"></span>
                        <span th:text="${f.enabled} ? 'Actif' : 'Désactivé'"></span>
                    </span>
                </td>
                <td class="text-end">
                    <a th:href="@{/backoffice/formateurs/{id}/edit(id=${f.id})}" class="btn btn-sm btn-outline-primary btn-action"><i class="bi bi-pencil"></i> Modifier</a>
                    <form th:action="@{/backoffice/formateurs/{id}/delete(id=${f.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer ce formateur ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${formateurs.isEmpty()}">
                <td colspan="7" class="text-center text-muted py-4">Aucun formateur pour le moment.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
