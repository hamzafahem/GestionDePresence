<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Formateur — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 720px;">
    <h2 class="mb-4" th:text="${formateurId} != null ? 'Modifier le formateur' : 'Nouveau formateur'"></h2>

    <form th:action="${formateurId} != null ? @{/backoffice/formateurs/{id}(id=${formateurId})} : @{/backoffice/formateurs}"
          method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nom</label>
                <input type="text" name="nomFr" class="form-control" th:value="${request.nomFr}" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" name="prenomFr" class="form-control" th:value="${request.prenomFr}" required/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">CIN (identifiant de connexion)</label>
                <input type="text" name="cin" class="form-control" th:value="${request.cin}" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">
                    Mot de passe
                    <span th:if="${formateurId} != null" class="text-muted">(laisser vide pour ne pas changer)</span>
                </label>
                <input type="password" name="password" class="form-control" th:required="${formateurId} == null"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" th:value="${request.email}"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Téléphone</label>
                <input type="text" name="phone" class="form-control" th:value="${request.phone}"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Âge</label>
                <input type="number" name="age" class="form-control" th:value="${request.age}"/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sexe</label>
                <select name="sexe" class="form-select">
                    <option value="">—</option>
                    <option value="Homme" th:selected="${request.sexe} == 'Homme'">Homme</option>
                    <option value="Femme" th:selected="${request.sexe} == 'Femme'">Femme</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Adresse</label>
                <input type="text" name="address" class="form-control" th:value="${request.address}"/>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/formateurs}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
