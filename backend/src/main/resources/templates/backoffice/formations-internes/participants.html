<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Participants — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 720px;">
    <p><a th:href="@{/backoffice/formations-internes}">&larr; Retour</a></p>
    <h2 class="mb-4">Participants — <span th:text="${formation.intitule}"></span></h2>

    <table class="table table-striped bg-white shadow-sm">
        <thead><tr><th>Doctorant</th><th>Code Apogée</th><th></th></tr></thead>
        <tbody>
        <tr th:each="p : ${participants}">
            <td th:text="${p.nom} + ' ' + ${p.prenom}"></td>
            <td th:text="${p.codeApogee}"></td>
            <td class="text-end">
                <form th:action="@{/backoffice/formations-internes/{id}/participants/{doctorantId}/delete(id=${formation.id},doctorantId=${p.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">Retirer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/backoffice/formations-internes/{id}/inscrire(id=${formation.id})}" method="post" class="card p-3 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label class="form-label">Inscrire un doctorant</label>
        <div class="input-group">
            <select name="doctorantId" class="form-select" required>
                <option th:each="d : ${doctorants}" th:value="${d.id}" th:text="${d.nom} + ' ' + ${d.prenom}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Inscrire</button>
        </div>
    </form>
</div>
</body>
</html>
