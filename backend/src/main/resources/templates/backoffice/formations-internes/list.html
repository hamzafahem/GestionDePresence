<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Formation interne — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-easel-fill"></i></div>
            <div>
                <h3>Formation interne</h3>
                <p class="page-subtitle">Ateliers et séminaires internes au CEDoc</p>
            </div>
        </div>
        <a th:href="@{/backoffice/formations-internes/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle formation interne</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#formationsInternesTable" placeholder="Rechercher une formation interne...">
            </div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${formations.size()} + ' formations internes'"></div>
        <table class="table js-filterable" id="formationsInternesTable">
            <thead>
            <tr><th>Intitulé</th><th>Formateur</th><th>Dates</th><th>Lieu</th><th>Participants</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="f : ${formations}">
                <td th:text="${f.intitule}"></td>
                <td th:text="${f.formateurNomFr}"></td>
                <td th:text="${f.dateDebut} + ' → ' + ${f.dateFin}"></td>
                <td th:text="${f.lieu}"></td>
                <td>
                    <span th:text="${f.participantsCount}"></span>
                    <span th:if="${f.capaciteMax}"> / <span th:text="${f.capaciteMax}"></span></span>
                </td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-secondary btn-action js-view-row"><i class="bi bi-eye"></i> Voir</button>
                    <a th:href="@{/backoffice/formations-internes/{id}/participants(id=${f.id})}" class="btn btn-sm btn-outline-primary btn-action"><i class="bi bi-people"></i> Participants</a>
                    <form th:action="@{/backoffice/formations-internes/{id}/delete(id=${f.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cette formation interne ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
