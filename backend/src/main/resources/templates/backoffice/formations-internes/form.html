<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nouvelle formation interne — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4">Nouvelle formation interne</h2>

    <form th:action="@{/backoffice/formations-internes}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Intitulé</label>
            <input type="text" name="intitule" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Formateur</label>
            <select name="formateurId" class="form-select">
                <option value="">—</option>
                <option th:each="f : ${formateurs}" th:value="${f.id}" th:text="${f.prenomFr} + ' ' + ${f.nomFr}"></option>
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Date début</label>
                <input type="date" name="dateDebut" class="form-control"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Date fin</label>
                <input type="date" name="dateFin" class="form-control"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Lieu</label>
                <input type="text" name="lieu" class="form-control"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Capacité max</label>
                <input type="number" name="capaciteMax" class="form-control"/>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/formations-internes}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
