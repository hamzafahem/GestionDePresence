<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Formations — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-mortarboard-fill"></i></div>
            <div>
                <h3>Formations</h3>
                <p class="page-subtitle">Programmes doctoraux</p>
            </div>
        </div>
        <a th:href="@{/backoffice/formations/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle formation</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#formationsTable" placeholder="Rechercher une formation...">
            </div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${formations.size()} + ' formations'"></div>
        <table class="table js-filterable" id="formationsTable">
            <thead>
            <tr><th>Intitulé</th><th>Description</th><th>Début</th><th>Fin</th><th>Responsable</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="f : ${formations}">
                <td th:text="${f.intitule}"></td>
                <td th:text="${f.description}"></td>
                <td th:text="${f.dateDebut}"></td>
                <td th:text="${f.dateFin}"></td>
                <td style="min-width: 220px;">
                    <form th:action="@{/backoffice/formations/{id}/formateur(id=${f.id})}" method="post" class="d-flex gap-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="formateurId" class="form-select form-select-sm">
                            <option value="">— Aucun —</option>
                            <option th:each="fm : ${formateurs}" th:value="${fm.id}"
                                    th:text="${fm.prenomFr} + ' ' + ${fm.nomFr}"
                                    th:selected="${fm.id} == ${f.formateurId}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary btn-action text-nowrap"><i class="bi bi-person-check"></i></button>
                    </form>
                </td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-secondary btn-action js-view-row"><i class="bi bi-eye"></i> Voir</button>
                    <a th:href="@{/backoffice/formations/{id}/modules(id=${f.id})}" class="btn btn-sm btn-outline-secondary btn-action"><i class="bi bi-collection"></i> Modules</a>
                    <a th:href="@{/backoffice/formations/{id}/inscriptions(id=${f.id})}" class="btn btn-sm btn-outline-secondary btn-action"><i class="bi bi-person-check"></i> Inscriptions</a>
                    <a th:href="@{/backoffice/formations/{id}/edit(id=${f.id})}" class="btn btn-sm btn-outline-primary btn-action"><i class="bi bi-pencil"></i> Modifier</a>
                    <form th:action="@{/backoffice/formations/{id}/delete(id=${f.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cette formation ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
