<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Inscriptions — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 900px;">
    <p><a th:href="@{/backoffice/formations}">&larr; Retour aux formations</a></p>
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-person-check-fill"></i></div>
            <div>
                <h3>Inscriptions — <span th:text="${formation.intitule}"></span></h3>
                <p class="page-subtitle">Demandes d'inscription et doctorants affectés à cette formation</p>
            </div>
        </div>
    </div>

    <div class="table-card mb-4">
        <div class="table-card-header" th:text="${inscriptions.size()} + ' inscriptions'"></div>
        <table class="table">
            <thead>
            <tr><th>Doctorant</th><th>Statut</th><th>Demandée le</th><th>Traitée par</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="i : ${inscriptions}">
                <td th:text="${i.doctorantNom} + ' ' + ${i.doctorantPrenom}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${i.statut == 'APPROUVEE'} ? '#22c1a4' : (${i.statut == 'REJETEE'} ? '#ef6b6b' : '#f5a623'))"></span>
                        <span th:switch="${i.statut}">
                            <span th:case="'APPROUVEE'">Approuvée</span>
                            <span th:case="'REJETEE'">Rejetée</span>
                            <span th:case="*">En attente</span>
                        </span>
                    </span>
                </td>
                <td th:text="${i.dateCreation}"></td>
                <td th:text="${i.traiteParNomFr}"></td>
                <td class="text-end">
                    <form th:if="${i.statut == 'EN_ATTENTE'}" th:action="@{/backoffice/formations/{fid}/inscriptions/{id}/traiter(fid=${formation.id},id=${i.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="statut" value="APPROUVEE"/>
                        <button type="submit" class="btn btn-sm btn-outline-success btn-action"><i class="bi bi-check-lg"></i> Approuver</button>
                    </form>
                    <form th:if="${i.statut == 'EN_ATTENTE'}" th:action="@{/backoffice/formations/{fid}/inscriptions/{id}/traiter(fid=${formation.id},id=${i.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="statut" value="REJETEE"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-x-lg"></i> Rejeter</button>
                    </form>
                    <form th:action="@{/backoffice/formations/{fid}/inscriptions/{id}/delete(fid=${formation.id},id=${i.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary btn-action"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="filter-card">
        <form th:action="@{/backoffice/formations/{id}/inscriptions(id=${formation.id})}" method="post" class="d-flex gap-2 w-100 align-items-end">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="flex-fill">
                <label class="form-label small text-muted">Affecter directement un doctorant (approuvé d'office)</label>
                <select name="doctorantId" class="form-select" required>
                    <option th:each="d : ${doctorants}" th:value="${d.id}" th:text="${d.nom} + ' ' + ${d.prenom}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus"></i> Affecter</button>
        </form>
    </div>
</div>
</body>
</html>
