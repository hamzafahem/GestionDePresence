<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Modules — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-collection-fill"></i></div>
            <div>
                <h3>Modules — <span th:text="${formation.intitule}"></span></h3>
                <p class="page-subtitle">Gestion des modules et affectation des formateurs</p>
            </div>
        </div>
        <a th:href="@{/backoffice/formations}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Retour aux formations</a>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${modules.size()} + ' modules'"></div>
        <table class="table">
            <thead>
            <tr><th>Module</th><th>Formateur affecté</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${modules}">
                <td th:text="${m.nom}"></td>
                <td style="min-width: 260px;">
                    <form th:action="@{/backoffice/formations/{id}/modules/{moduleId}/formateur(id=${formation.id},moduleId=${m.id})}"
                          method="post" class="d-flex gap-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="formateurId" class="form-select form-select-sm">
                            <option value="">— Aucun —</option>
                            <option th:each="fm : ${formateurs}" th:value="${fm.id}"
                                    th:text="${fm.prenomFr} + ' ' + ${fm.nomFr}"
                                    th:selected="${fm.id} == ${m.formateurId}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary btn-action text-nowrap"><i class="bi bi-person-check"></i></button>
                    </form>
                </td>
                <td class="text-end">
                    <form th:action="@{/backoffice/formations/{id}/modules/{moduleId}/delete(id=${formation.id},moduleId=${m.id})}"
                          method="post" class="d-inline" onsubmit="return confirm('Supprimer ce module ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${modules.isEmpty()}">
                <td colspan="3" class="text-center text-muted py-4">Aucun module pour cette formation.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="filter-card mt-3">
        <form th:action="@{/backoffice/formations/{id}/modules(id=${formation.id})}" method="post" class="d-flex gap-2 w-100 align-items-end">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="filter-search">
                <label class="form-label">Nouveau module</label>
                <input type="text" name="nom" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Ajouter</button>
        </form>
    </div>
</div>
</body>
</html>
