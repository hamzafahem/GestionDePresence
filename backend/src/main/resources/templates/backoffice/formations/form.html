<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Formation — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4" th:text="${formationId} != null ? 'Modifier la formation' : 'Nouvelle formation'"></h2>

    <form th:action="${formationId} != null ? @{/backoffice/formations/{id}(id=${formationId})} : @{/backoffice/formations}"
          method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Intitulé</label>
            <input type="text" name="intitule" class="form-control" th:value="${request.intitule}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" th:text="${request.description}"></textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Date début</label>
                <input type="date" name="dateDebut" class="form-control" th:value="${request.dateDebut}"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Date fin</label>
                <input type="date" name="dateFin" class="form-control" th:value="${request.dateFin}"/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Formateur responsable</label>
            <select name="formateurId" class="form-select">
                <option value="">— Aucun —</option>
                <option th:each="f : ${formateurs}" th:value="${f.id}" th:text="${f.prenomFr} + ' ' + ${f.nomFr}"
                        th:selected="${f.id} == ${request.formateurId}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/formations}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
