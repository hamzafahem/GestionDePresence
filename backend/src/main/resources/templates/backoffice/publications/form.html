<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nouvelle publication — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4">Nouvelle publication</h2>

    <form th:action="@{/backoffice/publications}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Doctorant</label>
            <select name="doctorantId" class="form-select" required>
                <option th:each="d : ${doctorants}" th:value="${d.id}" th:text="${d.nom} + ' ' + ${d.prenom}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Type</label>
            <select name="type" class="form-select" required>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" name="titre" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Référence (revue / conférence / n° dépôt)</label>
            <input type="text" name="reference" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Date de publication</label>
            <input type="date" name="datePublication" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Lien</label>
            <input type="text" name="lien" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/publications}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
