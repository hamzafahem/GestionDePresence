<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Publications — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-journal-richtext"></i></div>
            <div>
                <h3>Publications</h3>
                <p class="page-subtitle">Articles, proceedings et brevets des doctorants</p>
            </div>
        </div>
        <a th:href="@{/backoffice/publications/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle publication</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#publicationsTable" placeholder="Rechercher une publication...">
            </div>
        </div>
        <div class="filter-select">
            <label>Type</label>
            <select class="form-select js-table-filter" data-target="#publicationsTable" data-filter-key="type">
                <option value="">Tous les types</option>
                <option value="ARTICLE">Article</option>
                <option value="PROCEEDING">Proceeding</option>
                <option value="BREVET">Brevet</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${publications.size()} + ' publications'"></div>
        <table class="table js-filterable" id="publicationsTable">
            <thead>
            <tr><th>Type</th><th>Doctorant</th><th>Titre</th><th>Référence</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="p, iter : ${publications}" th:attr="data-type=${p.type}">
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${p.type == 'ARTICLE'} ? '#5b7cfa' : (${p.type == 'PROCEEDING'} ? '#9b6bff' : '#f5a623'))"></span>
                        <span th:switch="${p.type}">
                            <span th:case="'ARTICLE'">Article</span>
                            <span th:case="'PROCEEDING'">Proceeding</span>
                            <span th:case="'BREVET'">Brevet</span>
                        </span>
                    </span>
                </td>
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(p.doctorantPrenom,0,1)} + ${#strings.substring(p.doctorantNom,0,1)}"></span>
                        <span th:text="${p.doctorantNom} + ' ' + ${p.doctorantPrenom}"></span>
                    </div>
                </td>
                <td th:text="${p.titre}"></td>
                <td th:text="${p.reference}"></td>
                <td th:text="${p.datePublication}"></td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-secondary btn-action js-view-row"><i class="bi bi-eye"></i> Voir</button>
                    <form th:action="@{/backoffice/publications/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cette publication ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
