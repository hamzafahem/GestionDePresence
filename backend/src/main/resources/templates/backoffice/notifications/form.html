<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nouvelle notification — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4">Nouvelle notification</h2>

    <form th:action="@{/backoffice/notifications}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Destinataire</label>
            <select name="doctorantId" class="form-select">
                <option value="">Tous les doctorants (diffusion)</option>
                <option th:each="d : ${doctorants}" th:value="${d.id}" th:text="${d.nom} + ' ' + ${d.prenom}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" name="titre" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Envoyer</button>
        <a th:href="@{/backoffice/notifications}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
