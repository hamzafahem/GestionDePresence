<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Notifications — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-bell-fill"></i></div>
            <div>
                <h3>Notifications</h3>
                <p class="page-subtitle">Notifications envoyées aux doctorants</p>
            </div>
        </div>
        <a th:href="@{/backoffice/notifications/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle notification</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#notificationsTable" placeholder="Rechercher une notification...">
            </div>
        </div>
        <div class="filter-select">
            <label>Statut</label>
            <select class="form-select js-table-filter" data-target="#notificationsTable" data-filter-key="lu">
                <option value="">Tous</option>
                <option value="true">Lu</option>
                <option value="false">Non lu</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${notifications.size()} + ' notifications'"></div>
        <table class="table js-filterable" id="notificationsTable">
            <thead>
            <tr><th>Titre</th><th>Message</th><th>Destinataire</th><th>Date</th><th>Statut</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notifications}" th:attr="data-lu=${n.lu}">
                <td th:text="${n.titre}"></td>
                <td th:text="${n.message}"></td>
                <td th:text="${n.doctorantNom} ?: 'Tous les doctorants'"></td>
                <td th:text="${n.dateCreation}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${n.lu} ? '#22c1a4' : '#8a90a2')"></span>
                        <span th:text="${n.lu} ? 'Lu' : 'Non lu'"></span>
                    </span>
                </td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-secondary btn-action js-view-row"><i class="bi bi-eye"></i> Voir</button>
                    <form th:action="@{/backoffice/notifications/{id}/delete(id=${n.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cette notification ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
