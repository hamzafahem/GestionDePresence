<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nouvelle réinscription — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mb-4">Nouvelle réinscription</h2>

    <form th:action="@{/backoffice/reinscriptions}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Doctorant</label>
            <select name="doctorantId" class="form-select" required>
                <option th:each="d : ${doctorants}" th:value="${d.id}" th:text="${d.nom} + ' ' + ${d.prenom}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Année universitaire</label>
            <select name="anneeUniversitaireId" class="form-select" required>
                <option th:each="a : ${annees}" th:value="${a.id}" th:text="${a.libelle}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/backoffice/reinscriptions}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
