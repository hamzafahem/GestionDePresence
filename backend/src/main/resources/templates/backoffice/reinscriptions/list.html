<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Réinscriptions — mpresence back-office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-icon-badge"><i class="bi bi-arrow-repeat"></i></div>
            <div>
                <h3>Réinscriptions</h3>
                <p class="page-subtitle">Réinscriptions annuelles des doctorants</p>
            </div>
        </div>
        <a th:href="@{/backoffice/reinscriptions/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nouvelle réinscription</a>
    </div>

    <div class="filter-card">
        <div class="filter-search">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0 js-table-search" data-target="#reinscriptionsTable" placeholder="Rechercher une réinscription...">
            </div>
        </div>
        <div class="filter-select">
            <label>Statut</label>
            <select class="form-select js-table-filter" data-target="#reinscriptionsTable" data-filter-key="statut">
                <option value="">Tous les statuts</option>
                <option value="EN_ATTENTE">En attente</option>
                <option value="APPROUVEE">Approuvée</option>
                <option value="REJETEE">Rejetée</option>
            </select>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-header" th:text="${reinscriptions.size()} + ' réinscriptions'"></div>
        <table class="table js-filterable" id="reinscriptionsTable">
            <thead>
            <tr><th>Doctorant</th><th>Année</th><th>Statut</th><th>Traitement</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="r, iter : ${reinscriptions}" th:attr="data-statut=${r.statut}">
                <td>
                    <div class="name-cell">
                        <span class="avatar-circle" th:classappend="'c' + (${iter.index} % 5 + 1)"
                              th:text="${#strings.substring(r.doctorantPrenom,0,1)} + ${#strings.substring(r.doctorantNom,0,1)}"></span>
                        <span th:text="${r.doctorantNom} + ' ' + ${r.doctorantPrenom}"></span>
                    </div>
                </td>
                <td th:text="${r.anneeLibelle}"></td>
                <td>
                    <span class="status-pill">
                        <span class="dot" th:style="'background:' + (${r.statut == 'APPROUVEE'} ? '#22c1a4' : (${r.statut == 'REJETEE'} ? '#ef6b6b' : '#f5a623'))"></span>
                        <span th:switch="${r.statut}">
                            <span th:case="'APPROUVEE'">Approuvée</span>
                            <span th:case="'REJETEE'">Rejetée</span>
                            <span th:case="*">En attente</span>
                        </span>
                    </span>
                </td>
                <td style="min-width: 260px;">
                    <form th:if="${r.statut == 'EN_ATTENTE'}" th:action="@{/backoffice/reinscriptions/{id}/traiter(id=${r.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="input-group input-group-sm mb-1">
                            <select name="statut" class="form-select">
                                <option value="APPROUVEE">Approuver</option>
                                <option value="REJETEE">Rejeter</option>
                            </select>
                            <button type="submit" class="btn btn-outline-primary">Valider</button>
                        </div>
                        <input type="text" name="commentaire" class="form-control form-control-sm" placeholder="Commentaire (optionnel)"/>
                    </form>
                    <span th:unless="${r.statut == 'EN_ATTENTE'}" class="text-muted small" th:text="${r.commentaire}"></span>
                </td>
                <td class="text-end">
                    <form th:action="@{/backoffice/reinscriptions/{id}/delete(id=${r.id})}" method="post"
                          onsubmit="return confirm('Supprimer cette réinscription ?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger btn-action"><i class="bi bi-trash"></i> Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
