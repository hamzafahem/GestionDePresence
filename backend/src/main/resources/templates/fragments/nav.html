<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="nav">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        html, body {
            margin: 0;
            background: #f5f6f8;
            overflow-x: hidden;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 250px;
            overflow-y: auto;
            background: #1e2333;
            color: #cfd3dc;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }
        .sidebar .brand {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,.08);
            font-weight: 600;
            color: #fff;
            font-size: 1.05rem;
        }
        .sidebar .user-box {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .sidebar .user-box .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3a4162;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }
        .sidebar .user-box .name {
            color: #fff;
            font-size: .9rem;
            font-weight: 600;
            line-height: 1.2;
        }
        .sidebar .user-box .role {
            font-size: .75rem;
            color: #9aa0b4;
        }
        .sidebar nav {
            flex: 1;
            padding: .5rem 0;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .6rem 1.1rem;
            color: #cfd3dc;
            text-decoration: none;
            font-size: .9rem;
            border-left: 3px solid transparent;
        }
        .sidebar nav a i.bi {
            font-size: 1.05rem;
            width: 1.2rem;
            text-align: center;
        }
        .sidebar nav a span.label {
            flex: 1;
        }
        .sidebar nav a .badge-count {
            font-size: .7rem;
            padding: .15rem .45rem;
            border-radius: 999px;
            background: #5b7cfa;
            color: #fff;
        }
        .sidebar nav a .badge-count.danger {
            background: #ef4444;
        }
        .sidebar nav a:hover {
            background: rgba(255,255,255,.06);
            color: #fff;
        }
        .sidebar nav a.active {
            background: #5b7cfa;
            color: #fff;
            border-left-color: #5b7cfa;
        }
        .sidebar nav a.active .badge-count {
            background: rgba(255,255,255,.35);
        }
        .sidebar .logout-box {
            padding: .75rem;
            border-top: 1px solid rgba(255,255,255,.08);
        }
        .sidebar .logout-box button {
            width: 100%;
        }
        .topbar {
            position: fixed;
            top: 0;
            left: 250px;
            right: 0;
            height: 64px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1rem;
            padding: 0 1.5rem;
            z-index: 15;
        }
        .topbar .search-box {
            flex: 1;
            max-width: 420px;
            margin-right: auto;
        }
        .topbar .icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f1f3f8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            border: none;
        }
        .topbar .icon-btn .dot {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: #fff;
            font-size: .65rem;
            min-width: 16px;
            height: 16px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }
        .topbar .user-chip {
            display: flex;
            align-items: center;
            gap: .5rem;
            border: none;
            background: none;
        }
        .topbar .user-chip .avatar-sm {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #5b7cfa;
            color: #fff;
            font-size: .8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .topbar .user-chip .user-text {
            text-align: left;
            line-height: 1.15;
        }
        .topbar .user-chip .user-text .u-name {
            font-size: .85rem;
            font-weight: 600;
            color: #222;
        }
        .topbar .user-chip .user-text .u-role {
            font-size: .72rem;
            color: #8a90a2;
        }
        @media (max-width: 576px) {
            .topbar .user-chip .user-text { display: none; }
        }

        /* ---- Design system commun aux pages CRUD (page-header, filtres, tableau) ---- */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        .page-header .page-title-row {
            display: flex;
            align-items: center;
            gap: .75rem;
        }
        .page-header .page-icon-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #e8efff;
            color: #4f7cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .page-header h3 {
            margin: 0;
            font-weight: 700;
        }
        .page-header .page-subtitle {
            color: #8a90a2;
            font-size: .85rem;
            margin: 0;
        }
        .filter-card {
            background: #fff;
            border: 1px solid #eceef2;
            border-radius: 14px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filter-card .filter-search {
            flex: 1;
            min-width: 220px;
        }
        .filter-card .filter-select label {
            display: block;
            font-size: .75rem;
            color: #8a90a2;
            margin-bottom: .25rem;
        }
        .table-card {
            background: #fff;
            border: 1px solid #eceef2;
            border-radius: 14px;
            overflow: hidden;
        }
        .table-card .table-card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #f1f2f5;
            color: #8a90a2;
            font-size: .85rem;
        }
        .table-card table {
            margin: 0;
        }
        .table-card table th {
            text-transform: uppercase;
            font-size: .7rem;
            letter-spacing: .03em;
            color: #8a90a2;
            border-bottom: 1px solid #f1f2f5;
            font-weight: 600;
        }
        .table-card table td {
            vertical-align: middle;
            border-bottom: 1px solid #f6f7f9;
        }
        .table-card table tr:last-child td {
            border-bottom: none;
        }
        .name-cell {
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .avatar-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            font-weight: 700;
            flex-shrink: 0;
            color: #fff;
            background: #5b7cfa;
        }
        .avatar-circle.c1 { background: #5b7cfa; }
        .avatar-circle.c2 { background: #9b6bff; }
        .avatar-circle.c3 { background: #22c1a4; }
        .avatar-circle.c4 { background: #f5a623; }
        .avatar-circle.c5 { background: #ef6b6b; }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-size: .8rem;
        }
        .status-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-action {
            border-radius: 8px;
            font-size: .78rem;
            padding: .3rem .65rem;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
        }
        body .container,
        body .container-fluid {
            margin-left: 250px;
            margin-top: 64px;
            width: calc(100% - 250px);
            max-width: calc(100% - 250px) !important;
            box-sizing: border-box;
            padding-top: 1.75rem;
            padding-bottom: 2rem;
        }

        .topbar .hamburger {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f1f3f8;
            border: none;
            align-items: center;
            justify-content: center;
            color: #444;
            margin-right: .5rem;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 19;
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform .25s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .topbar {
                left: 0;
            }
            .topbar .hamburger {
                display: flex;
            }
            body .container,
            body .container-fluid {
                margin-left: 0;
                width: 100%;
                max-width: 100% !important;
            }
            .sidebar-overlay.show {
                display: block;
            }
        }
    </style>

    <aside class="sidebar">
        <div class="brand">
            <i class="bi bi-mortarboard-fill"></i> mpresence — CEDoc
        </div>
        <div class="user-box">
            <div class="avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <div>
                <div class="name"
                     th:text="${#authentication != null} ? (${#authentication.principal.prenomFr} + ' ' + ${#authentication.principal.nomFr}) : 'Compte'">Compte</div>
                <div class="role"
                     th:if="${#authentication != null and !#authentication.authorities.isEmpty()}"
                     th:text="${#strings.replace((#authentication.authorities.![authority])[0], 'ROLE_', '')}"></div>
            </div>
        </div>
        <nav>
            <a href="/api/backoffice/dashboard"><i class="bi bi-house-door-fill"></i><span class="label">Accueil</span></a>
            <a href="/api/backoffice/notifications">
                <i class="bi bi-bell-fill"></i><span class="label">Notifications</span>
                <span class="badge-count danger" th:if="${unreadNotificationsCount} != null and ${unreadNotificationsCount} &gt; 0" th:text="${unreadNotificationsCount}"></span>
            </a>
            <a href="/api/backoffice/rendezvous"><i class="bi bi-calendar-event-fill"></i><span class="label">RDVs</span></a>
            <a href="/api/backoffice/formations-internes"><i class="bi bi-easel-fill"></i><span class="label">Formation interne</span></a>
            <a href="/api/backoffice/reinscriptions"><i class="bi bi-arrow-repeat"></i><span class="label">Réinscription</span></a>
            <a href="/api/backoffice/publications"><i class="bi bi-journal-richtext"></i><span class="label">Publications</span></a>
            <a href="/api/backoffice/formations"><i class="bi bi-mortarboard"></i><span class="label">Formations</span></a>
            <a href="/api/backoffice/inscriptions">
                <i class="bi bi-person-check-fill"></i><span class="label">Inscriptions</span>
                <span class="badge-count" th:if="${pendingInscriptionsCount} != null and ${pendingInscriptionsCount} &gt; 0" th:text="${pendingInscriptionsCount}"></span>
            </a>
            <a href="/api/backoffice/demandes">
                <i class="bi bi-envelope-paper-fill"></i><span class="label">Demandes</span>
                <span class="badge-count" th:if="${pendingDemandesCount} != null and ${pendingDemandesCount} &gt; 0" th:text="${pendingDemandesCount}"></span>
            </a>
            <a href="/api/backoffice/doctorants"><i class="bi bi-people-fill"></i><span class="label">Doctorants</span></a>
            <a href="/api/backoffice/formateurs"><i class="bi bi-person-workspace"></i><span class="label">Formateurs</span></a>
            <a href="/api/backoffice/affectations-formateurs">
                <i class="bi bi-person-video3"></i><span class="label">Affectations formateurs</span>
                <span class="badge-count" th:if="${pendingAffectationsFormateurCount} != null and ${pendingAffectationsFormateurCount} &gt; 0" th:text="${pendingAffectationsFormateurCount}"></span>
            </a>
            <a href="/api/backoffice/profil"><i class="bi bi-person-badge-fill"></i><span class="label">Mon profil</span></a>
        </nav>
        <div class="logout-box">
            <form th:action="@{/backoffice/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-outline-light btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </button>
            </form>
        </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <div class="topbar">
        <button type="button" class="hamburger" aria-label="Ouvrir le menu">
            <i class="bi bi-list" style="font-size:1.3rem;"></i>
        </button>
        <div class="search-box">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="search" class="form-control border-start-0" placeholder="Rechercher une formation, un document...">
            </div>
        </div>

        <a href="/api/backoffice/notifications" class="icon-btn">
            <i class="bi bi-bell"></i>
            <span class="dot" th:if="${unreadNotificationsCount} != null and ${unreadNotificationsCount} &gt; 0" th:text="${unreadNotificationsCount}"></span>
        </a>

        <div class="dropdown">
            <button class="user-chip dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <span class="avatar-sm"
                      th:text="${#authentication != null} ? (${#strings.substring(#authentication.principal.prenomFr,0,1)} + ${#strings.substring(#authentication.principal.nomFr,0,1)}) : '?'">HM</span>
                <span class="user-text" th:if="${#authentication != null}">
                    <div class="u-name" th:text="${#authentication.principal.prenomFr} + ' ' + ${#authentication.principal.nomFr}"></div>
                    <div class="u-role"
                         th:if="${!#authentication.authorities.isEmpty()}"
                         th:text="${(#authentication.authorities.![authority])[0] == 'ROLE_ADMIN'} ? 'Administrateur' : 'Formateur'"></div>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/api/backoffice/profil"><i class="bi bi-person-badge-fill me-2"></i>Mon profil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/backoffice/logout}" method="post" class="px-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="dropdown-item ps-0" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Déconnexion</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <!-- Modal générique "Voir" : réutilisé par toutes les pages liste, se remplit
         depuis les colonnes du <thead>/<tr> cliqué (voir script plus bas). -->
    <div class="modal fade" id="viewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Détails</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="none">
        document.addEventListener('DOMContentLoaded', function () {
            var path = window.location.pathname;
            document.querySelectorAll('.sidebar nav a').forEach(function (a) {
                var href = a.getAttribute('href');
                if (href && path.indexOf(href) === 0) {
                    a.classList.add('active');
                }
            });

            var sidebar = document.querySelector('.sidebar');
            var overlay = document.querySelector('.sidebar-overlay');
            var hamburger = document.querySelector('.hamburger');

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }

            if (hamburger) {
                hamburger.addEventListener('click', function () {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('show');
                });
            }
            if (overlay) {
                overlay.addEventListener('click', closeSidebar);
            }
            document.querySelectorAll('.sidebar nav a').forEach(function (a) {
                a.addEventListener('click', closeSidebar);
            });

            // --- Modal "Voir" générique : lit les <th> du tableau + les <td> de la
            // ligne cliquée (sauf la dernière colonne "Actions") et les affiche. ---
            document.addEventListener('click', function (e) {
                var btn = e.target.closest('.js-view-row');
                if (!btn) return;
                var tr = btn.closest('tr');
                var table = tr.closest('table');
                var allTh = Array.prototype.slice.call(table.querySelectorAll('thead th'), 0, -1);
                var allTd = Array.prototype.slice.call(tr.querySelectorAll('td'), 0, -1);
                var headers = [];
                var cells = [];
                allTd.forEach(function (td, i) {
                    // Colonnes interactives (formulaires de traitement/affectation) : pas de sens
                    // à les lire comme du texte dans le modal, on les ignore.
                    if (td.querySelector('select, input, textarea')) return;
                    var clone = td.cloneNode(true);
                    clone.querySelectorAll('.avatar-circle').forEach(function (el) { el.remove(); });
                    headers.push(allTh[i] ? allTh[i].textContent.trim() : '');
                    cells.push(clone.textContent.trim().replace(/\s+/g, ' '));
                });

                var body = document.getElementById('viewModalBody');
                body.textContent = '';
                headers.forEach(function (h, i) {
                    var wrap = document.createElement('div');
                    wrap.className = 'mb-2';
                    var label = document.createElement('div');
                    label.className = 'text-muted small';
                    label.textContent = h;
                    var value = document.createElement('div');
                    value.className = 'fw-semibold';
                    value.textContent = cells[i] || '—';
                    wrap.appendChild(label);
                    wrap.appendChild(value);
                    body.appendChild(wrap);
                });

                bootstrap.Modal.getOrCreateInstance(document.getElementById('viewModal')).show();
            });

            // --- Recherche + filtres génériques pour les tableaux liste. ---
            // <table id="x" class="js-filterable">, <input class="js-table-search" data-target="#x">,
            // <select class="js-table-filter" data-target="#x" data-filter-key="statut"> + <tr data-statut="...">
            document.querySelectorAll('table.js-filterable').forEach(function (table) {
                var searchInputs = document.querySelectorAll('.js-table-search[data-target="#' + table.id + '"]');
                var selects = document.querySelectorAll('.js-table-filter[data-target="#' + table.id + '"]');

                function apply() {
                    var q = (searchInputs[0] ? searchInputs[0].value : '').trim().toLowerCase();
                    table.querySelectorAll('tbody tr').forEach(function (tr) {
                        var visible = !q || tr.textContent.toLowerCase().indexOf(q) !== -1;
                        selects.forEach(function (sel) {
                            if (!visible) return;
                            var key = sel.dataset.filterKey;
                            var val = sel.value;
                            if (val && tr.dataset[key] !== val) visible = false;
                        });
                        tr.style.display = visible ? '' : 'none';
                    });
                }

                searchInputs.forEach(function (i) { i.addEventListener('input', apply); });
                selects.forEach(function (s) { s.addEventListener('change', apply); });
            });
        });
    </script>
</div>
</body>
</html>
